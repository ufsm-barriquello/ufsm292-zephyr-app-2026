CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

CONFIG_GPIO=y
CONFIG_SPI=y

# Rede: Ethernet1 (KSZ8851SNL) com IPv4 por DHCP
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

# Hora real pelo NTP.br (servidores por IP, sem DNS)
CONFIG_SNTP=y

# Coletor: GET /sensors no gateway e leitura do JSON
CONFIG_JSON_LIBRARY=y
# Gateway fora do ar não pode segurar o coletor por muito tempo
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=1500
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=1

CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=768

# SAMD21 tem 32 KB de RAM: pilha de rede enxuta
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_MAX_CONN=4
# Timeout de recv no HTTP: um cliente parado não trava o servidor
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_TCP_WORKQ_STACK_SIZE=768
# Como servidor, a rx_q responde ACK/FIN do TCP descendo até o driver SPI;
# com 1024 B ela estourava ao fechar a conexão HTTP.
CONFIG_NET_RX_STACK_SIZE=1536
CONFIG_NET_TX_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1280

# SAMD21 não tem TRNG; o TCP precisa de números aleatórios (portas, ISN)
CONFIG_TEST_RANDOM_GENERATOR=y

# SD por SPI (IO1) com FAT
CONFIG_SDHC=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_ACCESS=y

CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
# Nunca formatar o cartão se a montagem falhar (apagaria os dados)
CONFIG_FS_FATFS_MOUNT_MKFS=n
# Cada arquivo aberto reserva ~550 B de RAM: um para gravar e um para o /log
CONFIG_FS_FATFS_NUM_FILES=2
CONFIG_FS_FATFS_NUM_DIRS=1

# POST /reset reinicia a placa
CONFIG_REBOOT=y

CONFIG_MAIN_STACK_SIZE=2048
# O padrão é 2 KB; 1 KB basta para as interrupções (valor usado pelo supervisor)
# e compensa a RAM do NET_RX_STACK_SIZE maior.
CONFIG_ISR_STACK_SIZE=1024
# Sem MPU no SAMD21, estouro de pilha corrompe memória em silêncio; o
# sentinela transforma isso em pânico, e o nome diz qual thread estourou.
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y

# Endereço do gateway. Sem nada descomentado vale o padrão do Kconfig:

# Gateway real (grupo B): IP da serial do gateway, porta 80
CONFIG_SERVIDOR_GATEWAY_ADDR="192.168.0.100"
CONFIG_SERVIDOR_GATEWAY_PORTA=5500

# Reduzir buffers de rede para economizar RAM (SAMD21 tem apenas 32KB)
