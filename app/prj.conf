# Microkernel e alocacao de memoria (SAMD21 - 32KB RAM)
CONFIG_MAIN_STACK_SIZE=1280
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1280
CONFIG_HEAP_MEM_POOL_SIZE=1024

# Serial / Console / Printf
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_A_SUPPORT=y

# Suporte Newlib
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# Gerador aleatorio (Leve para a pilha IP)
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y

# Pilha de Rede TCP/IP e Sockets
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=n

# Reducao de buffers para caber em RAM
CONFIG_NET_PKT_RX_COUNT=2
CONFIG_NET_PKT_TX_COUNT=2
CONFIG_NET_BUF_RX_COUNT=6
CONFIG_NET_BUF_TX_COUNT=6
CONFIG_NET_BUF_DATA_SIZE=256

# Drivers de Rede e SPI (KSZ8851)
CONFIG_NET_DRIVERS=y
CONFIG_ETH_DRIVER=y
CONFIG_SPI=y
CONFIG_ETH_KSZ8851SNL=y

# Suporte a Memoria Flash e NVS (Non-Volatile Storage)
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
