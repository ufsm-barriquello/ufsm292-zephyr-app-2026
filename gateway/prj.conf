# Gateway bring-up image for the SAM R21 Xplained Pro (samr21_xpro only).
# Normal 802.15.4 L2 with a radio-bound raw packet socket for TX and RX.
# Promiscuous mode is enabled so any on-channel frame is accepted; frames
# carrying the 18-byte sensor payload are printed to the console.

CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=n
CONFIG_NET_L2_IEEE802154=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_PACKET=y
CONFIG_IEEE802154_NET_IF_NO_AUTO_START=y
# Codec consumes complete MAC frames without the hardware-generated FCS.
CONFIG_IEEE802154_L2_PKT_INCL_FCS=n
# Decode/print now runs in an application thread, not the driver RX thread.
CONFIG_IEEE802154_RF2XX_RX_STACK_SIZE=2048
CONFIG_NET_PKT_TX_COUNT=2
CONFIG_NET_PKT_RX_COUNT=8
# Bounded data pools shared by the network interfaces; validate again with HTTP.
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_BUF_DATA_SIZE=128
CONFIG_RADIO=y
CONFIG_GATEWAY_MEMORY=y
CONFIG_LOG=y
# rf2xx CSMA backoff needs rand; no TRNG driver on this board, use test RNG
CONFIG_TEST_RANDOM_GENERATOR=y
