# Gateway bring-up image for the SAM R21 Xplained Pro (samr21_xpro only).
# Normal 802.15.4 L2 with a radio-bound raw packet socket for TX and RX.
# Promiscuous mode is enabled so any on-channel frame is accepted; frames
# carrying the 18-byte sensor payload are printed to the console.

CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=n
CONFIG_NET_L2_IEEE802154=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_PACKET=y
CONFIG_IEEE802154_NET_IF_NO_AUTO_START=y
# Codec consumes complete MAC frames without the hardware-generated FCS.
CONFIG_IEEE802154_L2_PKT_INCL_FCS=n
# Decode/print now runs in an application thread, not the driver RX thread.
CONFIG_IEEE802154_RF2XX_RX_STACK_SIZE=2048
CONFIG_NET_PKT_TX_COUNT=2
CONFIG_NET_PKT_RX_COUNT=8
# Eight 256-byte fragments can hold a full Ethernet frame alongside radio traffic.
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_SPI=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
CONFIG_ETHERNET_LOG_LEVEL_INF=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_SYSTEM_WORKQUEUE=y
CONFIG_NET_IPV4=y
# Radio and Ethernet each need an IPv4 configuration slot.
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4_MAX_ROUTES=2
CONFIG_NET_MAX_CONTEXTS=3
CONFIG_NET_IPV6=n
CONFIG_RADIO=y
CONFIG_GATEWAY_MEMORY=y
CONFIG_GATEWAY_JSON=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=512
# Main also runs device/network initialization and deferred-log packaging.
CONFIG_ISR_STACK_SIZE=1024
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y
# rf2xx CSMA backoff needs rand; no TRNG driver on this board, use test RNG
CONFIG_TEST_RANDOM_GENERATOR=y

# HTTP/1 runs on main's stack, using Zephyr's incremental request parser.
CONFIG_NET_TCP=y
# serve_client() requires SO_SNDTIMEO on native Zephyr sockets.
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_STRICT=y
CONFIG_REBOOT=y
